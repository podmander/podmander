#
#  mise tasks for local development and test container management.
#  Install mise: https://mise.jdx.dev/

[tasks]

# --- Build ---

[tasks.build]
description = "Build all binaries via alr"
dir = "{{config_root}}"
run = "distrobox enter ada_dev -- alr build"

[tasks."build:clean"]
description = "Clean and rebuild all binaries"
dir = "{{config_root}}"
run = "distrobox enter ada_dev -- alr clean && distrobox enter ada_dev -- alr build"

# --- Format ---

[tasks.format]
description = "Auto-format Ada source files with gnatformat"
dir = "{{config_root}}"
run = "distrobox enter ada_dev -- bash -c 'eval $(alr printenv 2>/dev/null) && ~/.alire/bin/gnatformat -P podmander.gpr --no-subprojects'"

[tasks."format:check"]
description = "Check Ada source formatting without modifying files"
dir = "{{config_root}}"
run = "distrobox enter ada_dev -- bash -c 'eval $(alr printenv 2>/dev/null) && ~/.alire/bin/gnatformat -P podmander.gpr --no-subprojects --check'"

# --- Test ---

[tasks.test]
description = "Build and run the AUnit test suite"
dir = "{{config_root}}"
depends = ["build"]
run = "distrobox enter ada_dev -- alr exec -- ./bin/test_runner"

# --- Test Container Lifecycle ---

[tasks."test:container:build"]
description = "Build the privileged systemd test container image"
dir = "{{config_root}}"
run = "podman build -t podmander-test -f Containerfile.podmander ."

[tasks."test:container:up"]
description = "Start the test container with the workspace mounted"
dir = "{{config_root}}"
run = """
if podman container exists podmander-test; then
  echo "Container already exists. Remove it first with: mise run test:container:down"
  exit 1
fi
podman run -d --name podmander-test \
  --privileged \
  --systemd=always \
  -v "{{config_root}}:/workspace:Z" \
  -w /workspace \
  podmander-test
"""

[tasks."test:container:down"]
description = "Stop and remove the test container"
run = "podman rm -f podmander-test"

[tasks."test:container:clean"]
description = "Remove the test container and its image"
depends = ["test:container:down"]
run = "podman rmi -f podmander-test"
