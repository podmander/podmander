# Podmander worktree configuration
# Worktrees live at .worktrees/<branch> (configured in user config)

[[pre-start]]
mise = "mise trust"

[[pre-start]]
codegraph = "mise run utils:codegraph:init"

[[pre-merge]]
test = "mise run test"

[[post-merge]]
codegraph = "mise run utils:codegraph:sync"

[forge]
platform = "forgejo"
hostname = "code.monospacementor.com"
